services:
  wave:
    build: .
    container_name: wave-social
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_PATH: /app/data/data.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - wave-data:/app/data
      - wave-uploads:/app/public/uploads

volumes:
  wave-data:
  wave-uploads:
