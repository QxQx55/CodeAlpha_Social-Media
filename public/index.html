<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-bg"></div>

  <header class="topbar">
    <div class="topbar-inner container">
      <a class="brand" href="#/">
        <span class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="g1" x1="2" y1="2" x2="22" y2="22"><stop stop-color="#f09433"/><stop offset=".25" stop-color="#e6683c"/><stop offset=".5" stop-color="#dc2743"/><stop offset=".75" stop-color="#cc2366"/><stop offset="1" stop-color="#bc1888"/></linearGradient></defs><rect x="2" y="2" width="20" height="20" rx="6" stroke="url(#g1)" stroke-width="2"/><circle cx="12" cy="12" r="4.5" stroke="url(#g1)" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="url(#g1)"/></svg></span>
        <span class="brand-text">Pulse</span>
      </a>

      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="global-search" type="search" placeholder="Search people..." autocomplete="off">
        <div id="search-results" class="search-results hidden"></div>
      </div>

      <nav class="nav-actions">
        <a href="#/" class="nav-btn" data-nav="feed" title="Home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg></a>
        <a href="#/explore" class="nav-btn" data-nav="explore" title="Explore"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M16 8l-2 6-6 2 2-6 6-2z"/></svg></a>
        <a href="#/saved" class="nav-btn auth-only hidden" data-nav="saved" title="Saved"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12a1 1 0 011 1v16l-7-4-7 4V5a1 1 0 011-1z"/></svg></a>
        <a href="#/profile/me" class="nav-btn auth-only hidden" data-nav="profile" id="nav-profile-btn" title="Profile"><span class="nav-avatar" id="nav-avatar">?</span></a>
        <div id="auth-actions"></div>
      </nav>
    </div>
  </header>

  <main class="container main-layout">
    <section class="feed-col">
      <div id="message" class="toast hidden"></div>

      <!-- AUTH VIEW -->
      <section id="view-auth" class="view hidden">
        <div class="auth-shell">
          <div class="auth-hero">
            <div class="auth-hero-inner">
              <div class="auth-logo"><svg width="44" height="44" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="g2" x1="2" y1="2" x2="22" y2="22"><stop stop-color="#f09433"/><stop offset=".5" stop-color="#dc2743"/><stop offset="1" stop-color="#bc1888"/></linearGradient></defs><rect x="2" y="2" width="20" height="20" rx="6" stroke="url(#g2)" stroke-width="2"/><circle cx="12" cy="12" r="4.5" stroke="url(#g2)" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="url(#g2)"/></svg></div>
              <h1>Pulse</h1>
              <p>Share moments. Follow friends. Join the conversation.</p>
              <div class="auth-mock">
                <div class="mock-card"><div class="mock-head"><span class="mock-av"></span><span class="mock-line w60"></span></div><div class="mock-img"></div><div class="mock-lines"><span class="mock-line"></span><span class="mock-line w80"></span></div></div>
              </div>
            </div>
          </div>
          <div class="auth-panel card">
            <div class="auth-tabs">
              <button class="tab active" data-auth-tab="login">Log in</button>
              <button class="tab" data-auth-tab="register">Sign up</button>
            </div>
            <form id="login-form" class="stack auth-form">
              <label><span>Username</span><input name="username" required autocomplete="username" placeholder="Username"></label>
              <label><span>Password</span><input name="password" type="password" required autocomplete="current-password" placeholder="Password"></label>
              <button class="btn primary btn-block" type="submit">Log in</button>
            </form>
            <form id="register-form" class="stack auth-form hidden">
              <label><span>Username</span><input name="username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" autocomplete="username" placeholder="Choose a username"></label>
              <label><span>Password</span><input name="password" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label>
              <label><span>Bio</span><textarea name="bio" maxlength="200" rows="2" placeholder="A little about you (optional)"></textarea></label>
              <button class="btn primary btn-block" type="submit">Create account</button>
            </form>
            <p class="auth-foot muted">By continuing, you agree to share good vibes only.</p>
          </div>
        </div>
      </section>

      <!-- FEED VIEW -->
      <section id="view-feed" class="view hidden">
        <div class="stories-bar card" id="stories-bar"></div>

        <div class="card composer" id="composer-card">
          <div class="composer-top">
            <div class="avatar sm" id="composer-avatar">?</div>
            <button class="composer-trigger" id="open-composer">What's on your mind?</button>
          </div>
          <form id="post-form" class="composer-form hidden">
            <textarea id="post-content" maxlength="700" rows="3" placeholder="Write a caption..."></textarea>
            <input id="post-image" type="url" placeholder="Image URL (optional, https://...)" maxlength="500">
            <div id="post-image-preview" class="img-preview hidden"></div>
            <div class="composer-actions">
              <span class="muted" id="post-count">0/700</span>
              <div class="composer-btns">
                <button type="button" class="btn ghost small" id="cancel-post">Cancel</button>
                <button type="submit" class="btn primary small">Share</button>
              </div>
            </div>
          </form>
        </div>

        <div class="feed-tabs">
          <button class="feed-tab active" data-feed="all">For you</button>
          <button class="feed-tab" data-feed="following">Following</button>
        </div>

        <div id="feed-list" class="posts-list"></div>
      </section>

      <!-- EXPLORE VIEW -->
      <section id="view-explore" class="view hidden">
        <div class="page-head">
          <h2>Explore</h2>
          <p class="muted">Discover popular posts from the community</p>
        </div>
        <div id="explore-grid" class="explore-grid"></div>
      </section>

      <!-- SAVED VIEW -->
      <section id="view-saved" class="view hidden">
        <div class="page-head">
          <h2>Saved</h2>
          <p class="muted">Posts you've bookmarked</p>
        </div>
        <div id="saved-list" class="posts-list"></div>
      </section>

      <!-- PROFILE VIEW -->
      <section id="view-profile" class="view hidden">
        <div class="card profile-hero" id="profile-hero"></div>
        <div class="profile-tabs">
          <button class="ptab active" data-ptab="posts"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Posts</button>
        </div>
        <div id="profile-posts" class="posts-list"></div>
      </section>
    </section>

    <aside class="side-col" id="side-col">
      <div class="side-sticky">
        <div class="card side-card" id="side-user"></div>
        <div class="card side-card">
          <div class="side-head"><span>Suggested for you</span></div>
          <div id="suggested-list" class="suggested-list"></div>
        </div>
        <footer class="side-footer muted">
          <span>About</span> · <span>Help</span> · <span>Pulse © 2026</span>
        </footer>
      </div>
    </aside>
  </main>

  <!-- Edit profile modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close="modal"></div>
    <div class="modal-card card">
      <div class="modal-head"><h3>Edit profile</h3><button class="icon-btn" data-close="modal">&times;</button></div>
      <form id="edit-profile-form" class="stack">
        <label><span>Bio</span><textarea name="bio" maxlength="200" rows="3" placeholder="Your bio"></textarea></label>
        <label><span>Avatar URL</span><input name="avatar_url" type="url" maxlength="500" placeholder="https://..."></label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" data-close="modal">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <template id="post-template">
    <article class="card post">
      <div class="post-header">
        <button class="avatar post-avatar" data-action="profile"></button>
        <div class="post-meta">
          <button class="post-author" data-action="profile"></button>
          <div class="post-time muted"></div>
        </div>
        <button class="icon-btn post-more hidden" data-action="delete" title="Delete post"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
      </div>
      <div class="post-image-wrap hidden"><img class="post-image" alt="Post image" loading="lazy"></div>
      <div class="post-body">
        <div class="post-actions">
          <div class="post-actions-left">
            <button class="icon-btn like-btn" data-action="like" title="Like"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg></button>
            <button class="icon-btn comment-focus-btn" data-action="focus-comment" title="Comment"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></button>
          </div>
          <button class="icon-btn save-btn" data-action="save" title="Save"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12a1 1 0 011 1v16l-7-4-7 4V5a1 1 0 011-1z"/></svg></button>
        </div>
        <div class="post-likes"><strong class="like-count">0</strong> likes</div>
        <div class="post-caption"><button class="caption-author" data-action="profile"></button> <span class="post-content"></span></div>
        <div class="post-comments-wrap">
          <button class="view-comments-btn muted hidden" data-action="toggle-comments"></button>
          <div class="comments"></div>
        </div>
        <form class="comment-form">
          <input name="comment" maxlength="300" placeholder="Add a comment..." autocomplete="off">
          <button type="submit" class="comment-submit" disabled>Post</button>
        </form>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
